    var list = INTERESTS.filter(function (i) { return filter === 'all' || i.tags.indexOf(filter) !== -1; });
    function count(id) { return INTERESTS.filter(function (i) { return id === 'all' || i.tags.indexOf(id) !== -1; }).length; }
    return h('section', { id: 'interests', className: 'wrap', style: { paddingBottom: '88px', scrollMarginTop: '88px' } },
      h(motion.div, { initial: { opacity: 0.3, y: 22 }, whileInView: { opacity: 1, y: 0 }, viewport: { once: true, amount: 0.2 }, transition: { duration: 0.6 }, className: 'flex flex-col gap-5 mb-8' },
        h('span', { className: 'eyebrow' }, h(Icon, { name: 'Sparkles', size: 15 }), 'Интересы'),
        h('h2', { className: 'display h2' }, 'Чем я занимаюсь и что люблю'),
        h('div', { className: 'flex flex-wrap gap-2', role: 'group', 'aria-label': 'Фильтр по тегам' },
          FILTERS.map(function (f) {
            return h('button', { key: f.id, type: 'button', className: 'chip', 'aria-pressed': filter === f.id ? 'true' : 'false', onClick: function () { setFilter(f.id); } },
              f.label, h('small', null, count(f.id)));
          })
        )
      ),
      h(motion.div, { layout: true, className: 'grid gap-4 sm:grid-cols-2 lg:grid-cols-3' },
        h(AnimatePresence, { mode: 'popLayout' },
          list.map(function (it, idx) {
            return h(motion.article, {
              key: it.id, layout: true, className: 'glass card flex flex-col gap-4',
              initial: { opacity: 0, scale: 0.92, y: 16 }, animate: { opacity: 1, scale: 1, y: 0 }, exit: { opacity: 0, scale: 0.92 },
              transition: { duration: 0.35, delay: Math.min(idx * 0.04, 0.3) }, whileHover: { y: -4 }
            },
              h('div', { className: 'tile' }, h(Icon, { name: it.icon, size: 24 })),
              h('div', { className: 'flex flex-col gap-2' },
                h('h3', { className: 'display', style: { fontSize: '1.25rem', letterSpacing: '-0.02em', margin: 0 } }, it.title),
                h('p', { style: { margin: 0, color: 'var(--muted)', fontSize: '0.96rem' } }, it.text)
              ),
              h('div', { className: 'flex flex-wrap gap-2 mt-auto' }, it.tags.map(function (t) { return h('span', { key: t, className: 'tag' }, '#' + t); }))
            );
          })
        )
      )
    );
  }

  /* ---------- game ---------- */
  var ICONS = { apple: 'Apple', star: 'Star', bug: 'Bug' };
  var POINTS = { apple: 1, star: 3, bug: -2 };
  var LABELS = { apple: 'яблоко', star: 'звезда', bug: 'баг' };
  var DURATION = 30;

  function Game() {
    var sPhase = useState('idle'), phase = sPhase[0], setPhase = sPhase[1];
    var sScore = useState(0), score = sScore[0], setScore = sScore[1];
    var sTime = useState(DURATION), time = sTime[0], setTime = sTime[1];
    var sBest = useState(function () { var v = parseInt(read(KEY_BEST), 10); return isNaN(v) ? 0 : v; }), best = sBest[0], setBest = sBest[1];
    var sFresh = useState(false), fresh = sFresh[0], setFresh = sFresh[1];
    var sScene = useState({ items: [], pops: [] }), scene = sScene[0], setScene = sScene[1];
    var area = useRef(null);
    var st = useRef({ items: [], pops: [], score: 0, id: 0, run: false, raf: 0, best: best });

    useEffect(function () {
      return function () { st.current.run = false; cancelAnimationFrame(st.current.raf); };
    }, []);

    function finish() {
      var s = st.current;
      s.run = false;
      cancelAnimationFrame(s.raf);
      setTime(0);
      setScene({ items: [], pops: [] });
      if (s.score > s.best) {
        s.best = s.score;
        write(KEY_BEST, s.score);
        setBest(s.score);
        setFresh(true);
      }
      setPhase('over');
    }

    function start() {
      var s = st.current;
      cancelAnimationFrame(s.raf);
      s.items = []; s.pops = []; s.score = 0; s.next = 200; s.run = true;
      s.t0 = performance.now(); s.last = s.t0;
      setScore(0); setTime(DURATION); setFresh(false); setScene({ items: [], pops: [] }); setPhase('running');
      function tick(now) {
        if (!s.run) return;
        var dt = Math.min(now - s.last, 50);
        s.last = now;
        var elapsed = (now - s.t0) / 1000;
        var left = Math.max(0, DURATION - elapsed);
        var box = area.current;
        var w = box ? box.clientWidth : 320, hgt = box ? box.clientHeight : 380;
        s.next -= dt;
        if (s.next <= 0) {
          var r = Math.random();
          var kind = r < 0.14 ? 'star' : r < 0.32 ? 'bug' : 'apple';
          var base = kind === 'star' ? 230 : kind === 'bug' ? 150 : 115;
          s.items.push({ id: s.id++, kind: kind, x: Math.random() * Math.max(1, w - 48), y: -52, v: base + elapsed * 3 + Math.random() * 60 });
          s.next = 680 - Math.min(380, elapsed * 13) + Math.random() * 200;
        }
        s.items = s.items.filter(function (it) { it.y += it.v * dt / 1000; return !it.dead && it.y < hgt + 10; });
        s.pops = s.pops.filter(function (p) { p.life -= dt; p.y -= dt * 0.04; return p.life > 0; });
        setScene({ items: s.items.slice(), pops: s.pops.slice() });
        setTime(Math.ceil(left));
        if (left <= 0) { finish(); return; }
        s.raf = requestAnimationFrame(tick);
      }
      s.raf = requestAnimationFrame(tick);
    }

    function hit(id) {
      var s = st.current;
      if (!s.run) return;
      var it = null;
      for (var i = 0; i < s.items.length; i++) { if (s.items[i].id === id) { it = s.items[i]; break; } }
      if (!it || it.dead) return;
      it.dead = true;
      var pts = POINTS[it.kind];
      s.score = Math.max(0, s.score + pts);
      setScore(s.score);
      s.pops.push({ id: 'p' + (s.id++), x: it.x, y: it.y, txt: (pts > 0 ? '+' : '−') + Math.abs(pts), color: pts > 0 ? 'var(--accent)' : 'var(--danger)', life: 700 });
      setScene({ items: s.items.filter(function (x) { return !x.dead; }), pops: s.pops.slice() });
    }

    var pct = Math.max(0, Math.min(100, (time / DURATION) * 100));

    return h('section', { id: 'game', className: 'wrap', style: { paddingBottom: '40px', scrollMarginTop: '88px' } },
      h(motion.div, { initial: { opacity: 0.3, y: 22 }, whileInView: { opacity: 1, y: 0 }, viewport: { once: true, amount: 0.1 }, transition: { duration: 0.6 }, className: 'flex flex-col gap-6' },
        h('div', { className: 'flex flex-col gap-4' },
          h('span', { className: 'eyebrow' }, h(Icon, { name: 'Gamepad2', size: 15 }), 'Мини-игра'),
          h('h2', { className: 'display h2' }, 'Собери урожай за 30 секунд'),
          h('div', { className: 'flex flex-wrap gap-x-6 gap-y-2' },
            h('span', { className: 'legend' }, h('span', { className: 'accent-text' }, h(Icon, { name: 'Apple', size: 18 })), 'Яблоко: +1'),
            h('span', { className: 'legend' }, h('span', { className: 'warm-text' }, h(Icon, { name: 'Star', size: 18 })), 'Звезда: +3'),
            h('span', { className: 'legend' }, h('span', { style: { color: 'var(--danger)' } }, h(Icon, { name: 'Bug', size: 18 })), 'Баг: −2')
          )
        ),
        h('div', { className: 'grid grid-cols-3 gap-3' },
          h('div', { className: 'glass stat' }, h('span', null, h(Icon, { name: 'Zap', size: 13 }), 'Очки'), h('b', null, score)),
          h('div', { className: 'glass stat' }, h('span', null, h(Icon, { name: 'Timer', size: 13 }), 'Время'), h('b', null, time + ' с')),
          h('div', { className: 'glass stat' }, h('span', null, h(Icon, { name: 'Trophy', size: 13 }), 'Рекорд'), h('b', null, best))
        ),
        h('div', { className: 'meter', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': DURATION, 'aria-valuenow': time, 'aria-label': 'Оставшееся время' }, h('i', { style: { width: pct + '%' } })),
        h('div', { ref: area, className: 'glass arena' },
          scene.items.map(function (it) {
            return h('button', {
              key: it.id, type: 'button', className: 'drop drop-' + it.kind, 'aria-label': LABELS[it.kind],
              style: { transform: 'translate3d(' + it.x + 'px,' + it.y + 'px,0)' },
              onPointerDown: function (e) { e.preventDefault(); hit(it.id); }
            }, h(Icon, { name: ICONS[it.kind], size: 26 }));
          }),
          scene.pops.map(function (p) {
            return h('div', { key: p.id, className: 'pop', style: { transform: 'translate3d(' + (p.x + 12) + 'px,' + p.y + 'px,0)', opacity: Math.max(0, p.life / 700), color: p.color } }, p.txt);
          }),
          phase !== 'running' && h(motion.div, { className: 'overlay', initial: { opacity: 0 }, animate: { opacity: 1 }, transition: { duration: 0.3 } },
            h('div', { className: 'flex flex-col items-center gap-4' },
              phase === 'over'
                ? h(React.Fragment, null,
                    h('div', { className: 'display', style: { fontSize: 'clamp(2rem,6vw,3rem)' } }, 'Время вышло'),
                    h('p', { style: { margin: 0, color: 'var(--muted)' } }, 'Ваш счёт: ', h('b', { style: { color: 'var(--fg)' } }, score)),
                    fresh && h('div', { className: 'tag', style: { color: 'var(--accent)', borderColor: 'var(--accent)' } }, 'Новый рекорд'))
                : h(React.Fragment, null,
                    h('div', { className: 'display', style: { fontSize: 'clamp(1.8rem,5vw,2.6rem)' } }, 'Лови то, что падает'),
                    h('p', { style: { margin: 0, color: 'var(--muted)', maxWidth: '34ch' } }, 'Нажимай на яблоки и звёзды. Багов лучше избегать. Рекорд хранится в этом браузере.')),
              h(motion.button, { className: 'btn btn-primary', type: 'button', onClick: start, whileTap: { scale: 0.96 } },
                h(Icon, { name: phase === 'over' ? 'RotateCcw' : 'Play', size: 18 }), phase === 'over' ? 'Сыграть ещё' : 'Начать')
            )
          )
        )
      )
    );
  }

  function Footer() {
    return h('footer', { className: 'wrap', style: { paddingTop: '48px', color: 'var(--muted)', fontSize: '0.9rem', display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
      h(Icon, { name: 'MapPin', size: 15 }), 'Сделано в Алматы. React, Tailwind CSS, Lucide и framer-motion.');
  }

  function App() {
    var t = useTheme();
    return h(React.Fragment, null,
      h(Header, { dark: t.dark, toggle: t.toggle }),
      h('main', null, h(Hero), h(Interests), h(Game)),
      h(Footer)
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
